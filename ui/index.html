<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VieNeu-TTS — UI</title>
<style>
  :root { --bg:#0f1419; --card:#1a2029; --line:#2a3340; --fg:#e6edf3; --mut:#8b98a5;
          --acc:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg);
         color:var(--fg); line-height:1.5; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 18px 60px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 5px; }
  textarea, select, input { width:100%; background:#0d1117; color:var(--fg);
          border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px;
          font-family:inherit; }
  textarea { min-height:130px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:150px; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--mut);
          margin-top:6px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:11px 20px;
          font-size:15px; font-weight:600; cursor:pointer; margin-top:16px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  .modes { display:flex; gap:8px; margin-top:6px; }
  .modes .opt { flex:1; text-align:center; padding:9px; border:1px solid var(--line);
          border-radius:8px; cursor:pointer; font-size:13px; user-select:none; }
  .modes .opt.on { border-color:var(--acc); background:rgba(59,130,246,.12); color:#fff; }
  .modes .opt.dis { opacity:.45; cursor:not-allowed; }
  .bar { height:8px; background:#0d1117; border-radius:99px; overflow:hidden; margin-top:14px; }
  .bar > i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .status { font-size:13px; margin-top:10px; min-height:20px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px;
          font-weight:600; }
  .pill.cpu { background:rgba(34,197,94,.15); color:var(--ok); }
  .pill.gpu { background:rgba(245,158,11,.15); color:var(--warn); }
  audio { width:100%; margin-top:14px; }
  .err { color:var(--err); }
  .hint { font-size:12px; color:var(--mut); margin-top:4px; }
  code { background:#0d1117; padding:1px 5px; border-radius:4px; font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:99px; margin-right:5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ VieNeu-TTS</h1>
  <div class="sub">Giao diện gọi API <code id="apibase">…</code> (cổng riêng) ·
    <a id="docslink" href="#" style="color:var(--acc)">Swagger</a></div>

  <div class="card">
    <label for="apikey">API key (Bearer) <span class="hint" style="display:inline">— gửi kèm <code>Authorization: Bearer …</code>, lưu trên trình duyệt này</span></label>
    <input id="apikey" type="password" placeholder="Dán API key…" autocomplete="off" />
  </div>

  <div class="card">
    <div class="meta">
      <span><span class="dot" id="hdot"></span><span id="health">đang kiểm tra…</span></span>
      <span id="voicecount"></span>
    </div>

    <label for="text">Văn bản</label>
    <textarea id="text" placeholder="Nhập văn bản tiếng Việt…">Xin chào, đây là VieNeu-TTS, hệ thống tổng hợp giọng nói tiếng Việt.</textarea>
    <div class="meta">
      <span id="charcount">0 từ</span>
      <span id="gpuhint"></span>
    </div>

    <div class="row">
      <div>
        <label for="voice">Giọng</label>
        <select id="voice"></select>
      </div>
      <div>
        <label for="style">Phong cách</label>
        <select id="style"></select>
      </div>
    </div>

    <label>Chế độ xử lý</label>
    <div class="modes" id="modes">
      <div class="opt on" data-mode="auto">Auto</div>
      <div class="opt" data-mode="cpu">CPU</div>
      <div class="opt" data-mode="gpu">GPU</div>
    </div>
    <div class="hint" id="modehint">Auto: BE tự chọn — GPU khi văn bản đủ dài, còn lại CPU.</div>

    <button id="go">Tổng hợp</button>
    <button id="cancel" class="ghost" style="display:none">Hủy</button>

    <div class="bar"><i id="prog"></i></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:6px;">
      🎙️ Nạp / Clone Giọng Mới
    </h3>
    <div class="sub" style="margin-bottom:12px;">Ghi âm từ Micro hoặc tải lên file mẫu audio 3–8s (rõ tiếng, không tạp âm) để nạp vào DB.</div>

    <div class="row">
      <div>
        <label for="c_name">Tên / ID giọng (*)</label>
        <input id="c_name" type="text" placeholder="Ví dụ: giong_minh_1" />
      </div>
      <div>
        <label for="c_gender">Giới tính</label>
        <select id="c_gender">
          <option value="nam">Nam</option>
          <option value="nu">Nữ</option>
          <option value="khac">Khác</option>
        </select>
      </div>
    </div>

    <label for="c_desc">Mô tả giọng (tùy chọn)</label>
    <input id="c_desc" type="text" placeholder="Ví dụ: Giọng đọc truyền cảm, ấm áp..." />

    <label>Nguồn Audio mẫu (Ghi âm từ Micro hoặc Chọn File)</label>
    <div class="row" style="margin-top:6px; align-items:center;">
      <div style="flex:1;">
        <button id="btn_rec" type="button" class="ghost" style="margin-top:0; width:100%;">🔴 Bắt đầu Ghi âm</button>
      </div>
      <div style="text-align:center; color:var(--mut); font-size:12px; min-width:30px;">hoặc</div>
      <div style="flex:1;">
        <input id="c_file" type="file" accept="audio/*" style="padding:6px; font-size:13px;" />
      </div>
    </div>

    <div id="c_rec_status" class="status" style="font-size:12px; margin-top:6px;"></div>
    <audio id="c_audio_preview" controls style="display:none; margin-top:10px; width:100%;"></audio>

    <button id="c_go" style="background:var(--ok); width:100%; margin-top:16px;">➕ Nạp Giọng Vào Hệ Thống</button>
    <div id="c_status" class="status"></div>
  </div>
</div>

<script>
// API base do main.py nhúng (window.__API_BASE__) vì giao diện chạy ở CỔNG KHÁC.
// Fallback: cùng origin (khi ai đó mở file qua chính API server).
const API = (window.__API_BASE__ || "") + "/api/v1";
const $ = (id) => document.getElementById(id);
let GPU_MIN = 1000, curMode = "auto", pollTimer = null, curJob = null;

const wordCount = (s) => (s.trim().match(/\S+/g) || []).length;

// ── API key (Bearer) — 1 mã dùng chung, lưu localStorage trên máy này ─────────
const KEY_STORE = "vieneu_api_key";
const getKey = () => ($("apikey").value || "").trim();
// Header Authorization chỉ gắn khi có key (BE bỏ auth nếu VIENEU_API_KEY rỗng).
function authHeaders(extra){
  const h = Object.assign({}, extra || {});
  const k = getKey();
  if(k) h["Authorization"] = "Bearer " + k;
  return h;
}

async function jget(p){
  const r = await fetch(API+p, {headers: authHeaders()});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status);
  return r.json();
}

// ── init: health + voices + styles ──────────────────────────────────────────
async function init(){
  // Hiện API base + link Swagger đúng cổng API (giao diện chạy cổng khác).
  const apiOrigin = window.__API_BASE__ || location.origin;
  $("apibase").textContent = apiOrigin + "/api/v1";
  $("docslink").href = apiOrigin + "/docs";
  try{
    const h = await jget("/health");
    GPU_MIN = h.gpu_min_words || 1000;
    const ok = h.model_loaded;
    $("hdot").style.background = ok ? "var(--ok)" : "var(--warn)";
    $("health").textContent = `${h.status} · ${h.backend||"?"}/${h.device||"?"} · ${h.backbone_repo||""}`;
    $("voicecount").textContent = `${h.num_voices} giọng`;
  }catch(e){ $("hdot").style.background="var(--err)"; $("health").textContent="không kết nối được BE"; }

  try{
    const v = await jget("/voices");
    $("voice").innerHTML = v.voices.map(x =>
      `<option value="${x.id}" ${x.is_default?"selected":""}>${x.label}</option>`).join("");
  }catch(e){ $("voice").innerHTML = "<option value=''>(model chưa sẵn sàng)</option>"; }

  try{
    const s = await jget("/styles");
    $("style").innerHTML = s.styles.map(x =>
      `<option value="${x.id}" ${x.is_default?"selected":""}>${x.label}</option>`).join("");
  }catch(e){}

  updateChars();
}

function updateChars(){
  const n = wordCount($("text").value);
  $("charcount").textContent = `${n} từ`;
  const longEnough = n >= GPU_MIN;
  $("gpuhint").textContent = longEnough ? "✓ đủ dài cho GPU" : `cần ≥ ${GPU_MIN} từ cho GPU`;
  // GPU mode bị vô hiệu khi context ngắn (chặn lớp FE — BE vẫn chặn lần 2).
  const gpuOpt = document.querySelector('.opt[data-mode="gpu"]');
  gpuOpt.classList.toggle("dis", !longEnough);
  if(!longEnough && curMode==="gpu"){ setMode("auto"); }
}

function setMode(m){
  const opt = document.querySelector(`.opt[data-mode="${m}"]`);
  if(opt.classList.contains("dis")) return;
  curMode = m;
  document.querySelectorAll(".modes .opt").forEach(o=>o.classList.toggle("on", o.dataset.mode===m));
  $("modehint").textContent = ({
    auto:"Auto: BE tự chọn — GPU khi văn bản đủ dài, còn lại CPU.",
    cpu:"CPU: chạy in-process ngay trên server này.",
    gpu:"GPU: tạo máy Vast.ai theo yêu cầu, xong hủy máy.",
  })[m];
}

// ── tạo job + poll ──────────────────────────────────────────────────────────
async function synth(){
  $("audio").style.display="none"; $("status").textContent=""; $("status").className="status";
  $("prog").style.width="0";
  const body = { text:$("text").value, voice:$("voice").value||null,
                 style:$("style").value, mode:curMode };
  let res;
  try{
    const r = await fetch(API+"/tts", {method:"POST",
                                       headers:authHeaders({"Content-Type":"application/json"}),
                                       body:JSON.stringify(body)});
    res = await r.json();
    if(!r.ok) throw new Error(res.detail||r.status);
  }catch(e){ $("status").innerHTML=`<span class="err">Lỗi: ${e.message}</span>`; return; }

  curJob = res.id;
  $("go").disabled=true; $("cancel").style.display="inline-block";
  const badge = `<span class="pill ${res.mode}">${res.mode.toUpperCase()}</span>`;
  $("status").innerHTML = `${badge} đã tạo job <code>${res.id.slice(0,8)}</code>…`;
  poll(res.id, res.mode);
}

function poll(id, mode){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async ()=>{
    let j;
    try{ j = await jget("/tts/"+id); }catch(e){ return poll(id, mode); }
    const badge = `<span class="pill ${j.mode}">${j.mode.toUpperCase()}</span>`;
    $("prog").style.width = (j.progress||0)+"%";
    if(j.status==="running"||j.status==="queued"){
      $("status").innerHTML = `${badge} ${j.status}… ${j.progress}% (${j.done_chunks}/${j.total_chunks})`;
      poll(id, mode);
    } else if(j.status==="done"){
      done();
      $("status").innerHTML = `${badge} ✓ xong · ${j.duration_sec}s audio · ${j.elapsed_sec}s xử lý`;
      // Thẻ <audio src> KHÔNG gửi được header Bearer → tải bằng fetch rồi tạo blob URL.
      try{
        const r = await fetch(API+`/tts/${id}/download`, {headers: authHeaders()});
        if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.status);
        const url = URL.createObjectURL(await r.blob());
        const a=$("audio"); a.src = url; a.style.display="block"; a.play().catch(()=>{});
      }catch(e){ $("status").innerHTML += ` <span class="err">(tải audio lỗi: ${e.message})</span>`; }
    } else if(j.status==="cancelled"){
      done(); $("status").innerHTML = `${badge} đã hủy.`;
    } else {
      done(); $("status").innerHTML = `<span class="err">Lỗi: ${j.error||"unknown"}</span>`;
    }
  }, 1000);
}

function done(){ $("go").disabled=false; $("cancel").style.display="none"; clearTimeout(pollTimer); }

async function cancel(){
  if(!curJob) return;
  await fetch(API+"/tts/"+curJob, {method:"DELETE", headers: authHeaders()}).catch(()=>{});
}

// ── wire ────────────────────────────────────────────────────────────────────
// Key: nạp từ localStorage khi mở, lưu lại mỗi lần gõ, gọi lại init() để thử kết nối.
$("apikey").value = localStorage.getItem(KEY_STORE) || "";
$("apikey").addEventListener("input", ()=>{
  localStorage.setItem(KEY_STORE, getKey());
  clearTimeout(window._keyDebounce);
  window._keyDebounce = setTimeout(init, 400);   // key đổi → thử lại health/voices
});
$("text").addEventListener("input", updateChars);
$("go").addEventListener("click", synth);
$("cancel").addEventListener("click", cancel);
document.querySelectorAll(".modes .opt").forEach(o =>
  o.addEventListener("click", ()=>setMode(o.dataset.mode)));
// ── Voice Cloning: MediaRecorder + WAV Convert + Enroll API ─────────────────
let mediaRecorder = null, audioChunks = [], recordedBlob = null;

// Hàm convert bất kỳ Audio Blob (WebM/OGG) sang PCM WAV (16-bit) chuẩn
async function blobToWavBlob(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  
  const numOfChan = audioBuffer.numberOfChannels;
  const sampleRate = audioBuffer.sampleRate;
  const length = audioBuffer.length * numOfChan * 2 + 44;
  const buffer = new ArrayBuffer(length);
  const view = new DataView(buffer);
  const channels = [];
  let offset = 0, pos = 0;

  function writeString(str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    offset += str.length;
  }
  function setUint16(data) { view.setUint16(offset, data, true); offset += 2; }
  function setUint32(data) { view.setUint32(offset, data, true); offset += 4; }

  writeString('RIFF'); setUint32(length - 8); writeString('WAVE');
  writeString('fmt '); setUint32(16); setUint16(1); setUint16(numOfChan);
  setUint32(sampleRate); setUint32(sampleRate * numOfChan * 2);
  setUint16(numOfChan * 2); setUint16(16);
  writeString('data'); setUint32(length - 44);

  for (let i = 0; i < numOfChan; i++) channels.push(audioBuffer.getChannelData(i));

  while (pos < audioBuffer.length) {
    for (let i = 0; i < numOfChan; i++) {
      let sample = Math.max(-1, Math.min(1, channels[i][pos]));
      sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
    pos++;
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

if ($("btn_rec")) {
  $("btn_rec").addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      recordedBlob = null;
      mediaRecorder = new MediaRecorder(stream);
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const rawBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        $("c_rec_status").innerHTML = `<span>⏳ Đang định dạng sang file WAV...</span>`;
        try {
          recordedBlob = await blobToWavBlob(rawBlob);
          const url = URL.createObjectURL(recordedBlob);
          $("c_audio_preview").src = url;
          $("c_audio_preview").style.display = "block";
          $("c_rec_status").innerHTML = `<span style="color:var(--ok)">✓ Đã ghi âm & chuyển sang WAV (${(recordedBlob.size/1024).toFixed(1)} KB). Bấm nút dưới để nạp!</span>`;
        } catch (e) {
          recordedBlob = rawBlob;
          $("c_rec_status").innerHTML = `<span class="err">Lỗi chuyển định dạng: ${e.message}</span>`;
        }
        $("btn_rec").textContent = "🔴 Bắt đầu Ghi âm lại";
        $("btn_rec").style.background = "transparent";
        $("c_file").value = "";
        stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.start();
      $("btn_rec").textContent = "⏹️ Dừng Ghi âm (Đang thu...)";
      $("btn_rec").style.background = "rgba(239, 68, 68, 0.2)";
      $("c_rec_status").innerHTML = `<span style="color:var(--err)">🔴 Đang ghi âm từ Micro... Hãy nói 3–8 giây rõ tiếng!</span>`;
    } catch (err) {
      $("c_rec_status").innerHTML = `<span class="err">Không truy cập được Micro: ${err.message}</span>`;
    }
  });
}

if ($("c_file")) {
  $("c_file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
      recordedBlob = null;
      const url = URL.createObjectURL(file);
      $("c_audio_preview").src = url;
      $("c_audio_preview").style.display = "block";
      $("c_rec_status").innerHTML = `<span style="color:var(--ok)">✓ Đã chọn file: ${file.name}</span>`;
    }
  });
}

if ($("c_go")) {
  $("c_go").addEventListener("click", async () => {
    const name = ($("c_name").value || "").trim();
    const desc = ($("c_desc").value || "").trim();
    const gender = $("c_gender").value;
    const fileInput = $("c_file").files[0];
    const cStatus = $("c_status");

    if (!name) {
      cStatus.innerHTML = `<span class="err">Vui lòng nhập Tên / ID giọng!</span>`;
      return;
    }

    let audioToSend = null;
    if (fileInput) {
      audioToSend = fileInput;
    } else if (recordedBlob) {
      audioToSend = new File([recordedBlob], `recorded_voice.wav`, { type: "audio/wav" });
    }

    if (!audioToSend) {
      cStatus.innerHTML = `<span class="err">Vui lòng Ghi âm từ Micro hoặc Chọn 1 file Audio mẫu!</span>`;
      return;
    }

    cStatus.innerHTML = `<span>⏳ Đang phân tích & trích xuất đặc trưng giọng...</span>`;
    $("c_go").disabled = true;

    try {
      const fd = new FormData();
      fd.append("name", name);
      fd.append("audio", audioToSend);
      fd.append("description", desc);
      fd.append("gender", gender);

      const r = await fetch(API + "/voices", {
        method: "POST",
        headers: authHeaders(),
        body: fd,
      });

      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);

      cStatus.innerHTML = `<span style="color:var(--ok); font-weight:600;">🎉 Đã nạp thành công giọng '${res.id}' vào DB!</span>`;
      await init();
      if ($("voice")) {
        $("voice").value = res.id;
      }
    } catch (e) {
      cStatus.innerHTML = `<span class="err">Lỗi nạp giọng: ${e.message}</span>`;
    } finally {
      $("c_go").disabled = false;
    }
  });
}

init();
</script>
</body>
</html>
